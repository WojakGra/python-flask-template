[project]
name = "python-flask-template"
version = "0.1.0"
description = "Flask app template: uv, SQLAlchemy 2, Alembic, pytest, ruff, mypy, Docker."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bootstrap-flask>=2.6.0",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "flask-compress>=1.25",
    "flask-cors>=6.0.5",
    "flask-limiter>=4.1.1",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-marshmallow>=1.5.0",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-talisman>=1.1.0",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "marshmallow-sqlalchemy>=1.5.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "flask-debugtoolbar>=0.16.0",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
# Generated by Flask-Migrate; force-exclude also applies when pre-commit passes file names.
extend-exclude = ["migrations"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
# Extensions without type hints.
module = ["flask_babel", "flask_bootstrap", "flask_login", "flask_migrate", "flask_talisman", "flask_wtf", "wtforms.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# FlaskForm, UserMixin, marshmallow schemas and Flask-Login decorators are untyped (Any).
module = ["app.models.*", "app.forms.*", "app.controllers.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.poe.tasks]
setup = { expr = "'.env exists' if pathlib.Path('.env').exists() else 'created ' + shutil.copyfile('.env.example', '.env')", imports = ["pathlib", "shutil"], help = "Create .env from .env.example if missing" }
prepare = { sequence = ["setup", "migrate"], help = "setup + migrate (also VS Code's pre-launch task)" }
dev = { sequence = ["prepare", { cmd = "flask run --debug" }], help = "Run locally with auto-reload on http://127.0.0.1:5000" }
db-init = { cmd = "flask db init", help = "Create the migrations/ folder (once per project)" }
migrate = { cmd = "flask db upgrade", help = "Apply migrations" }
migration = { cmd = "flask db migrate", help = 'New migration from model changes: poe migration -m "add orders"' }
test = { cmd = "pytest", help = "Run tests" }
check = { sequence = ["ruff check .", "ruff format --check .", "mypy"], default_item_type = "cmd", help = "Lint, format check, type check" }
fmt = { sequence = ["ruff check --fix .", "ruff format ."], default_item_type = "cmd", help = "Fix lint issues and format" }
i18n-extract = { cmd = "pybabel extract -F babel.cfg -k _l -o messages.pot .", help = "Collect translatable strings into messages.pot" }
i18n-update = { cmd = "pybabel update -i messages.pot -d app/translations", help = "Merge messages.pot into every language's .po file" }
i18n-init = { cmd = "pybabel init -i messages.pot -d app/translations", help = "Add a language: poe i18n-init -l de" }
i18n-compile = { cmd = "pybabel compile -d app/translations", help = "Compile .po files to .mo" }
mail = { cmd = "docker compose up -d mailpit", help = "Start Mailpit (SMTP on :1025, inbox on http://localhost:8025)" }
up = { sequence = ["setup", { cmd = "docker compose up --build" }], help = "Full stack on http://localhost:8000" }
down = { cmd = "docker compose down", help = "Stop the stack" }

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
strict = true
filterwarnings = [
    "error",
    # Flask-Login 0.6.3 (last release, 2023) calls utcnow() for remember-me cookies; fixed on its main branch.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login",
    # migrations/env.py from `flask db init` tries the deprecated db.get_engine() first.
    "ignore:'get_engine' is deprecated:DeprecationWarning",
]

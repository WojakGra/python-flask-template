{% extends "base.html" %}
{% from "bootstrap5/form.html" import render_form %}
{% block title %}{{ _("Sign in") }}{% endblock %}
{% block content %}
  <div class="col-md-6 col-lg-4">
    <h1 class="h3 mb-3">{{ _("Sign in") }}</h1>
    {{ render_form(form) }}
    <p class="mt-3 mb-1"><a href="{{ url_for('auth.reset_request') }}">{{ _("Forgot your password?") }}</a></p>
    <p>{{ _("New here?") }} <a href="{{ url_for('auth.register') }}">{{ _("Register") }}</a></p>
  </div>
{% endblock %}

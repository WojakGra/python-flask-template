{% from "bootstrap5/utils.html" import render_messages %}
<!doctype html>
<html lang="{{ current_locale() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# htmx would inject an inline <style>, which the Content-Security-Policy blocks #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}{{ _("Flask App") }}{% endblock %}</title>
  {{ bootstrap.load_css() }}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
  <nav class="navbar navbar-expand bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('web.index') }}">{{ _("Flask App") }}</a>
      <div class="navbar-nav ms-auto align-items-center gap-2">
        {% for code in config.LANGUAGES if code != current_locale()|string %}
          <a class="nav-link" href="{{ url_for('web.set_language', code=code, next=request.full_path) }}">{{ code|upper }}</a>
        {% endfor %}
        {% if current_user.is_authenticated %}
          <span class="navbar-text">{{ current_user.email }}</span>
          <form method="post" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-outline-secondary btn-sm">{{ _("Sign out") }}</button>
          </form>
        {% else %}
          <a class="nav-link" href="{{ url_for('auth.login') }}">{{ _("Sign in") }}</a>
          <a class="btn btn-primary btn-sm" href="{{ url_for('auth.register') }}">{{ _("Register") }}</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container">
    {{ render_messages(dismissible=True) }}
    {% block content %}{% endblock %}
  </main>
  {{ bootstrap.load_js() }}
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
          integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
          crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
